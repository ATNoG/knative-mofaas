---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-mofaas-atnog-v1-mofaasfunction
  failurePolicy: Fail
  name: vmofaasfunction.kb.io
  rules:
  - apiGroups:
    - mofaas.atnog
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - mofaasfunctions
  sideEffects: None
