# permissions for end users to edit mofaasfunctions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mofaas-contoller
    app.kubernetes.io/managed-by: kustomize
  name: mofaasfunction-editor-role
rules:
- apiGroups:
  - mofaas.atnog
  resources:
  - mofaasfunctions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mofaas.atnog
  resources:
  - mofaasfunctions/status
  verbs:
  - get
