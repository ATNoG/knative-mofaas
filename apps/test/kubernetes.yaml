apiVersion: v1
kind: Namespace
metadata:
  name: mofaas-test-app
  labels:
    mofaas: nvp
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: test
  namespace: mofaas-test-app
spec:
  template: 
    spec:
      containers:
        - image: 10.43.67.161:5000/test
          env:
            - name: DIRECTUS_URL
              value: http://directus.directus:8055
            - name: DIRECTUS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: directus-secret
                  key: DIRECTUS_API_TOKEN

---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: test2
  namespace: mofaas-test-app
spec:
  template:
    spec:
      containers:
        - image: 10.43.67.161:5000/test
          env:
            - name: DIRECTUS_URL
              value: http://directus.directus:8055
            - name: DIRECTUS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: directus-secret
                  key: DIRECTUS_API_TOKEN
---
apiVersion: v1
kind: Secret
metadata:
  name: directus-secret
  namespace: mofaas-test-app
type: Opaque
data:
  DIRECTUS_API_TOKEN: QmR0NXRZQ0RTTFMzLW42MmpVOFhndDFzWXJ6eWlwc1E=
---
apiVersion: mofaas.atnog/v1
kind: MoFaaSFunction
metadata:
  name: my-function
  namespace: mofaas-test-app
spec:
  concurrency: 2
  variants:
  - apiVersion: serving.knative.dev/v1
    kind: Service
    name: test
  - apiVersion: serving.knative.dev/v1
    kind: Service
    name: test2
  # - apiVersion: serving.knative.dev/v1
  #   kind: Service
  #   name: test
  ignore-headers:
  - ce-id
  - Date
  - x-envoy-upstream-service-time
