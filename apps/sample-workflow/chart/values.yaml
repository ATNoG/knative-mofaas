namespace: mofaas-sample-workflow
registry: "ghcr.io/atnog/knative-mofaas/sample-workflow"
oneVersionServices:
  - name: entry-point
    annotations:
      autoscaling.knative.dev/min-scale: "1"
      autoscaling.knative.dev/max-scale: "1"
  - name: result
    annotations:
      autoscaling.knative.dev/min-scale: "1"
      autoscaling.knative.dev/max-scale: "1"
    labels:
      networking.knative.dev/visibility: cluster-local
multiVersionServices:
  - name: function
    deploymentType: "normal"    # attack or normal
    concurrency: 1
    pathSize: 10
    versions: 1
    ignoreHeaders:
      - ce-id
      - Date
      - x-envoy-upstream-service-time
      - Content-Length
      - x-powered-by
    labels:
      networking.knative.dev/visibility: cluster-local
    annotations:
      autoscaling.knative.dev/min-scale: "1"
      autoscaling.knative.dev/max-scale: "1"
languages:
  - python
  - python
  - python
  - python
  - python
  - python
  - python
  - python
  - python
  - python
