# apiVersion: v1
# kind: Namespace
# metadata:
#   name: mofaas-bank-app
#   labels:
#     mofaas: nvp
# ---
apiVersion: v1
kind: Secret
metadata:
  name: bank-app-secret
  namespace: mofaas-bank-app
type: Opaque
data:
  directus_api_token: QmR0NXRZQ0RTTFMzLW42MmpVOFhndDFzWXJ6eWlwc1E=
  jwt_key: dmVyeV9zZWNyZXRfa2V5
  otp_secret: MTIzNDU2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-app-configmap
  namespace: mofaas-bank-app
data:
  directus_url: http://directus.directus:8055
  max_amount: "1000"
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: entry-point
  namespace: mofaas-bank-app
spec:
  template: 
    spec:
      containers:
        - image: 10.43.67.161:5000/bank-app/entry-point
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: login
  namespace: mofaas-bank-app
spec:
  template: 
    spec:
      containers:
        - image: 10.43.67.161:5000/bank-app/login
          env:
            - name: DIRECTUS_URL
              valueFrom:
                configMapKeyRef:
                  name: bank-app-configmap
                  key: directus_url
            - name: DIRECTUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bank-app-secret
                  key: directus_api_token
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bank-app-secret
                  key: jwt_key
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: authorization-python
  namespace: mofaas-bank-app
spec:
  template: 
    spec:
      containers:
        - image: 10.43.67.161:5000/bank-app/authorization/python
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bank-app-secret
                  key: jwt_key
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: authorization-java
  namespace: mofaas-bank-app
spec:
  template: 
    spec:
      containers:
        - image: 10.43.67.161:5000/bank-app/authorization/java
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bank-app-secret
                  key: jwt_key
---
apiVersion: mofaas.atnog/v1
kind: MoFaaSFunction
metadata:
  name: authorization
  namespace: mofaas-bank-app
spec:
  concurrency: 2
  variants:
  - apiVersion: serving.knative.dev/v1
    kind: Service
    name: authorization-python
  - apiVersion: serving.knative.dev/v1
    kind: Service
    name: authorization-java
  ignore-headers:
  - ce-id
  - Date
  - x-envoy-upstream-service-time
  - Content-Length
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: verify-transaction-python
  namespace: mofaas-bank-app
spec:
  template: 
    spec:
      containers:
        - image: 10.43.67.161:5000/bank-app/verify-transaction/python
          env:
            - name: DIRECTUS_URL
              valueFrom:
                configMapKeyRef:
                  name: bank-app-configmap
                  key: directus_url
            - name: DIRECTUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bank-app-secret
                  key: directus_api_token
            - name: OTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: bank-app-secret
                  key: otp_secret
            - name: MAX_AMOUNT
              valueFrom:
                configMapKeyRef:
                  name: bank-app-configmap
                  key: max_amount
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: verify-transaction-java
  namespace: mofaas-bank-app
spec:
  template: 
    spec:
      containers:
        - image: 10.43.67.161:5000/bank-app/verify-transaction/java
          env:
            - name: DIRECTUS_URL
              valueFrom:
                configMapKeyRef:
                  name: bank-app-configmap
                  key: directus_url
            - name: DIRECTUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bank-app-secret
                  key: directus_api_token
            - name: OTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: bank-app-secret
                  key: otp_secret
            - name: MAX_AMOUNT
              valueFrom:
                configMapKeyRef:
                  name: bank-app-configmap
                  key: max_amount
---
apiVersion: mofaas.atnog/v1
kind: MoFaaSFunction
metadata:
  name: verify-transaction
  namespace: mofaas-bank-app
spec:
  concurrency: 2
  variants:
  - apiVersion: serving.knative.dev/v1
    kind: Service
    name: verify-transaction-python
  - apiVersion: serving.knative.dev/v1
    kind: Service
    name: verify-transaction-java
  ignore-headers:
  - ce-id
  - Date
  - x-envoy-upstream-service-time
  - Content-Length
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: transaction
  namespace: mofaas-bank-app
spec:
  template: 
    spec:
      containers:
        - image: 10.43.67.161:5000/bank-app/transaction
          env:
            - name: DIRECTUS_URL
              valueFrom:
                configMapKeyRef:
                  name: bank-app-configmap
                  key: directus_url
            - name: DIRECTUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bank-app-secret
                  key: directus_api_token
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: result
  namespace: mofaas-bank-app
spec:
  template: 
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "1"
    spec:
      containers:
        - image: 10.43.67.161:5000/bank-app/result
---
# https://knative.dev/docs/eventing/brokers/broker-types/kafka-broker/#create-a-kafka-broker
apiVersion: eventing.knative.dev/v1
kind: Broker
metadata:
  annotations:
    eventing.knative.dev/broker.class: Kafka
  name: broker
  namespace: mofaas-bank-app
spec:
  # Configuration specific to this broker.
  config:
    apiVersion: v1
    kind: ConfigMap
    name: kafka-broker-config
    namespace: knative-eventing
---
apiVersion: sources.knative.dev/v1
kind: SinkBinding
metadata:
  name: bind-entry-point
  namespace: mofaas-bank-app
spec:
  subject:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: entry-point
  sink:
    ref:
      apiVersion: mofaas.atnog/v1
      kind: MoFaaSFunction
      name: authorization
      # apiVersion: serving.knative.dev/v1
      # kind: Service
      # name: authorization-python
---
apiVersion: sources.knative.dev/v1
kind: SinkBinding
metadata:
  name: bind-authorization
  namespace: mofaas-bank-app
spec:
  subject:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: mofaas-chooser-authorization
    # apiVersion: serving.knative.dev/v1
    # kind: Service
    # name: authorization-python
  sink:
    ref:
      apiVersion: eventing.knative.dev/v1
      kind: Broker
      name: broker
---
apiVersion: sources.knative.dev/v1
kind: SinkBinding
metadata:
  name: bind-verify-transaction
  namespace: mofaas-bank-app
spec:
  subject:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: mofaas-chooser-verify-transaction
  sink:
    ref:
      apiVersion: eventing.knative.dev/v1
      kind: Broker
      name: broker
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: verify-transaction-trigger
  namespace: mofaas-bank-app
spec:
  broker: broker
  filters:
    - exact:
        source: authorization
        dv: "true"
  subscriber:
    ref:
      apiVersion: mofaas.atnog/v1
      kind: MoFaaSFunction
      name: verify-transaction
    uri: /
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: authorization-bad-result-trigger
  namespace: mofaas-bank-app
spec:
  broker: broker
  filters:
    - exact:
        source: authorization
    - not:
        exact:
          dv: "true"
  subscriber:
    ref:
      apiVersion: serving.knative.dev/v1
      kind: Service
      name: result
    uri: /
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: transaction-trigger
  namespace: mofaas-bank-app
spec:
  broker: broker
  filters:
    - exact:
        source: verify-transaction
        dt: "true"
  subscriber:
    ref:
      apiVersion: serving.knative.dev/v1
      kind: Service
      name: transaction
    uri: /
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: verify-transaction-bad-result-trigger
  namespace: mofaas-bank-app
spec:
  broker: broker
  filters:
    - exact:
        source: verify-transaction
    - not:
        exact:
          dt: "true"
  subscriber:
    ref:
      apiVersion: serving.knative.dev/v1
      kind: Service
      name: result
    uri: /
---
apiVersion: sources.knative.dev/v1
kind: SinkBinding
metadata:
  name: bind-transaction-result
  namespace: mofaas-bank-app
spec:
  subject:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: transaction
  sink:
    ref:
      apiVersion: serving.knative.dev/v1
      kind: Service
      name: result
