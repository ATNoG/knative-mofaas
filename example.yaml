      containers:
        - image: 10.43.67.161:5000/test
---
apiVersion: mofaas.atnog/v1
kind: MoFaaSFunction
metadata:
  name: my-function
  namespace: mofaas
spec:
  concurrency: 2
  variants:
  - apiVersion: serving.knative.dev/v1
    kind: Service
    name: test
  - apiVersion: serving.knative.dev/v1
    kind: Service
    name: test2
  # - apiVersion: serving.knative.dev/v1
