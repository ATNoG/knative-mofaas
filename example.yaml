apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: test
  namespace: mofaas
spec:
  template: 
    spec:
      containers:
        - image: 10.43.67.161:5000/test
---
apiVersion: serving.knative.dev/v1
