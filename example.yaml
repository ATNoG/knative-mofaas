apiVersion: v1
kind: Namespace
metadata:
  name: mofaas
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: test
  namespace: mofaas
spec:
  template:
    spec:
      containers:
        - image: 10.43.67.161:5000/test
          env:
            - name: TARGET
              value: "Python Sample v1"
---
apiVersion: mofaas.atnog/v1
kind: MoFaaSFunction
metadata:
  name: my-function
  namespace: mofaas
spec:
  concurrency: 2
  variants:
  - apiVersion: serving.knative.dev/v1
    kind: Service
    name: test
    # revisionName: revision-service-a
  - apiVersion: serving.knative.dev/v1
    kind: Service
    name: service-b
    revisionName: revision-service-b
  - apiVersion: serving.knative.dev/v1
    kind: Service
    name: service-c
    revisionName: revision-service-c
