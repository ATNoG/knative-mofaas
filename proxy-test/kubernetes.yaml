apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: proxy-test
spec:
  selector:
    app: proxy
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30081
  type: NodePort

