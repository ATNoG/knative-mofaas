apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: proxy-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
        - name: proxy
          image: 10.43.67.161:5000/proxy:latest
          ports:
            - containerPort: 8080
              name: http
      # hostNetwork: true  # Use host network to bind to the node's IP
      # dnsPolicy: ClusterFirstWithHostNet

